name: validate

# The release repo's own checks: release.json schema, layout and version consistency, the
# neutrality check (no workgroup values in files, commit messages or the PR's title and body), and
# the checkers' own tests. Third-party actions are pinned by commit SHA (tag in the comment).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The neutrality check reads the PR's commit messages, so it needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: release.json, layout and version consistency
        run: python3 scripts/validate_release.py
      - name: The example manifest matches the schema
        run: python3 scripts/validate_release.py --manifest-only examples/release.example.json
      - name: Test the checkers
        run: python3 -m unittest discover -s tests -v
      - name: Neutrality (no workgroup values)
        # The literals come only from the NEUTRALITY_DENYLIST secret; with CI=true the check fails
        # closed when it is missing (a fork's PR gets no secrets, so it cannot go green here). PR
        # text reaches the script through env, never interpolated into the shell.
        env:
          NEUTRALITY_DENYLIST: ${{ secrets.NEUTRALITY_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          args=(--require-literals --text-env PR_TITLE --text-env PR_BODY)
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            args+=(--commits "${BASE_SHA}..${HEAD_SHA}")
          else
            # A first push or a force-push has no usable base; scan every commit on the branch.
            args+=(--commits "${HEAD_SHA}")
          fi
          python3 scripts/check_neutrality.py "${args[@]}"
