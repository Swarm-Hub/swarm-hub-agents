name: Secret Scan

# The one secret scan for this public repo: the free gitleaks binary, pinned and checksummed,
# over the working tree and over every commit the PR (or push) adds. Inlined rather than calling
# the org's shared action, because a public repo cannot use an action from an internal repo.
# The root .gitleaks.toml (all default rules, no allowlist) is picked up automatically.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksummed)
        env:
          GL_VER: "8.30.1"
          GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          curl --fail --retry 3 --retry-all-errors --retry-delay 2 --max-time 120 -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            -o "${dir}/gitleaks.tgz"
          echo "${GL_SHA256}  ${dir}/gitleaks.tgz" | sha256sum -c -
          tar -xzf "${dir}/gitleaks.tgz" -C "${dir}" gitleaks
          echo "${dir}" >> "${GITHUB_PATH}"
      - name: Scan the working tree
        run: gitleaks dir --no-banner --redact --exit-code 1 .
      - name: Scan the commits this change adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          gitleaks git --no-banner --redact --exit-code 1 --log-opts="${range}" .
